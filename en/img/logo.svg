<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="İklim ve Çevre Grubu amblemi">
  <title>İklim ve Çevre Grubu / Climate and Environment Group</title>
  <defs>
    <path id="drop" d="M60 16 C60 16 31 50 31 74 A29 29 0 0 0 89 74 C89 50 60 16 60 16 Z"/>
    <clipPath id="dropClip"><use href="#drop"/></clipPath>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#ffffff" stroke="#0c2340" stroke-width="5"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="#1b4f8a" stroke-width="1.5" opacity="0.35"/>
  <!-- Güneş / sun -->
  <g transform="translate(86 37) scale(0.85) translate(-89 -34)">
  <g stroke="#e87722" stroke-width="2.2" stroke-linecap="round">
    <line x1="89" y1="22" x2="89" y2="25"/><line x1="89" y1="43" x2="89" y2="46"/>
    <line x1="77" y1="34" x2="80" y2="34"/><line x1="98" y1="34" x2="101" y2="34"/>
    <line x1="80.5" y1="25.5" x2="82.6" y2="27.6"/><line x1="95.4" y1="40.4" x2="97.5" y2="42.5"/>
    <line x1="80.5" y1="42.5" x2="82.6" y2="40.4"/><line x1="95.4" y1="27.6" x2="97.5" y2="25.5"/>
  </g>
  <circle cx="89" cy="34" r="6" fill="#e87722"/>
  </g>
  <!-- Yağmur bulutu / rain cloud -->
  <g transform="translate(7 12) scale(0.8)">
  <path d="M20 37 a6 6 0 0 1 4 -10 a8 8 0 0 1 15 -2 a6 6 0 0 1 5 12 Z" fill="#1b4f8a"/>
  <g stroke="#1b4f8a" stroke-width="2" stroke-linecap="round">
    <line x1="26" y1="41" x2="24.5" y2="45"/><line x1="32" y1="41" x2="30.5" y2="45"/><line x1="38" y1="41" x2="36.5" y2="45"/>
  </g>
  </g>
  <g clip-path="url(#dropClip)">
    <!-- Su yarısı / water half -->
    <rect x="20" y="10" width="40" height="100" fill="#1b4f8a"/>
    <path d="M28 60 q5 -4 10 0 t10 0 t10 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M28 72 q5 -4 10 0 t10 0 t10 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M28 84 q5 -4 10 0 t10 0 t10 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <!-- Kuru toprak yarısı / dry soil half -->
    <rect x="60" y="10" width="40" height="100" fill="#e87722"/>
    <path d="M60 50 L68 58 L65 67 L74 74 L72 84 L80 92 M68 58 L78 55 M74 74 L85 72 M65 67 L60 70 M72 84 L63 90"
          fill="none" stroke="#8f430b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <use href="#drop" fill="none" stroke="#0c2340" stroke-width="3.5"/>
  <line x1="60" y1="20" x2="60" y2="102" stroke="#ffffff" stroke-width="2"/>
</svg>
